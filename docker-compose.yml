services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-store-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_store
      POSTGRES_USER: digital_store
      POSTGRES_PASSWORD: digital_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U digital_store -d digital_store"
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  provider-mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-store-provider-mock
    restart: unless-stopped
    entrypoint: ["/app/provider-mock"]
    environment:
      DATABASE_URL: postgres://digital_store:digital_store@postgres:5432/digital_store?sslmode=disable
      PROVIDER_MOCK_ADDR: ":8081"
      PROVIDER_A_FAIL_RATE: "0"
      PROVIDER_A_TIMEOUT_RATE: "0"
      PROVIDER_B_FAIL_RATE: "0"
      PROVIDER_B_TIMEOUT_RATE: "0"
      PROVIDER_MOCK_TIMEOUT: "5s"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital-store-api
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://digital_store:digital_store@postgres:5432/digital_store?sslmode=disable

      PROVIDER_A_URL: http://provider-mock:8081/provider-a
      PROVIDER_B_URL: http://provider-mock:8081/provider-b

      DELIVERY_POLL_INTERVAL: "500ms"
      DELIVERY_RETRY_DELAY: "10s"
      PROVIDER_TIMEOUT: "2s"
      PROVIDER_RETRY_COUNT: "3"
      RECONCILIATION_INTERVAL: "30s"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      provider-mock:
        condition: service_started

volumes:
  postgres_data: